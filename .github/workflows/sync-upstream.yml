# Keeps this fork's main identical to mattgodbolt/xania's main.
#
# It lives on the fork-sync branch, the fork's default branch, because scheduled workflows only run from the
# default branch; main itself stays a pure mirror of upstream, so branches cut from it carry nothing extra into
# upstream pull requests.
#
# GITHUB_TOKEN can't push changes to files under .github/workflows/. If upstream ever changes its workflows, this
# run fails with a permissions error: add a fine-grained personal access token with Contents and Workflows write on
# this repo as the SYNC_TOKEN secret, and it's used instead.
name: Sync main from upstream

on:
  schedule:
    - cron: "17 */6 * * *" # every six hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward main from mattgodbolt/xania
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main \
            --jq '"\(.merge_type): \(.message)"'
